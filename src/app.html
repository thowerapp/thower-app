<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="#0d0d0d" />
		<link rel="manifest" href="/pwa/manifest.webmanifest" />
		
		<!-- Métadonnées SEO de base -->
		<meta name="description" content="Thower - Suivez votre évolution physique avec un programme sur-mesure et l'accompagnement d'un coach sportif. Alimentation et sport." />
		<meta name="keywords" content="Thower, suivi physique, coach sportif, programme alimentation, programme sportif, évolution physique, nutrition, entraînement" />
		<meta name="author" content="Thower" />
		<meta name="robots" content="index, follow" />
		
		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Thower" />
		<meta property="og:description" content="Suivez votre évolution physique avec un programme sur-mesure et l'accompagnement d'un coach sportif. Alimentation et sport." />
		<meta property="og:image" content="%sveltekit.assets%/og-image.jpg" />
		<meta property="og:url" content="https://thower.com" />
		<meta property="og:site_name" content="Thower" />
		
		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Thower" />
		<meta name="twitter:description" content="Suivez votre évolution physique avec un programme sur-mesure et l'accompagnement d'un coach sportif. Alimentation et sport." />
		<meta name="twitter:image" content="%sveltekit.assets%/og-image.jpg" />
		
		<!-- Canonical -->
		<link rel="canonical" href="https://thower.com" />
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<main id="sveltekit-body-wrapper">
			%sveltekit.body%
		</main>
	</body>
</html>
